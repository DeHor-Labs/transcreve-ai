name: Fix OSV lock bumps
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/supply-chain-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Bump transformers in uv.lock
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git fetch origin main
          git show origin/main:uv.lock > uv.lock
          uv lock --upgrade-package transformers
          python - <<'PY'
          from pathlib import Path
          import re
          t = Path('uv.lock').read_text()
          m = re.search(r'name = "transformers"\nversion = "([^"]+)"', t)
          print('transformers', m.group(1) if m else None)
          assert m and tuple(map(int, m.group(1).split('.')[:2])) >= (5, 10)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and bump frontend lock
        working-directory: frontend
        run: |
          corepack enable
          git fetch origin main
          git show origin/main:frontend/pnpm-lock.yaml > pnpm-lock.yaml
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.pnpm = p.pnpm || {};
          p.pnpm.overrides = Object.assign({}, p.pnpm.overrides, {
            browserslist: '4.28.7',
            'baseline-browser-mapping': '2.11.0',
          });
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          pnpm install --no-frozen-lockfile
          grep -q 'browserslist@4.28.7' pnpm-lock.yaml
          grep -q 'baseline-browser-mapping@2.11.0' pnpm-lock.yaml
          ! grep -q 'PLACEHOLDER' pnpm-lock.yaml
          ! grep -q '@/workspace' pnpm-lock.yaml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock frontend/pnpm-lock.yaml frontend/package.json
          git status
          git commit -m 'fix(deps): bump transformers, browserslist, baseline-browser-mapping for OSV' || echo 'No changes'
          git push origin HEAD:ci/supply-chain-audit
