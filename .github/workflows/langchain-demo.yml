name: LangChain demo
on:
  pull_request:
    paths:
      - 'examples/langchain-transcreveai/**'
      - '.github/workflows/langchain-demo.yml'
  push:
    branches: [main]
    paths:
      - 'examples/langchain-transcreveai/**'
      - '.github/workflows/langchain-demo.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/langchain-transcreveai/requirements.txt
      - run: python -m pytest -q examples/langchain-transcreveai

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: langchain-demo-production
      cancel-in-progress: false
    steps:
      - name: Deploy da versão atual da main
        env:
          SSH_KEY: ${{ secrets.LANGCHAIN_DEPLOY_KEY }}
          SSH_HOST_KEY: ${{ secrets.LANGCHAIN_SSH_HOST_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/langchain_key
          chmod 600 ~/.ssh/langchain_key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/langchain_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes root@76.13.164.69
