name: LangChain demo
on:
  pull_request:
    paths:
      - 'examples/langchain-transcreveai/**'
      - '.github/workflows/langchain-demo.yml'
  push:
    branches: [main]
    paths:
      - 'examples/langchain-transcreveai/**'
      - '.github/workflows/langchain-demo.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/langchain-transcreveai/requirements.txt
      - run: python -m pytest -q examples/langchain-transcreveai
